[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "resumeOS"
version = "0.1.0"
description = "Local career warehouse — type resume init to start."
requires-python = ">=3.11"
dependencies = [
    "typer",
    "rich",
    "pypdf",
    "pdfplumber",
    "pyyaml",
    "httpx",
    "beautifulsoup4",
    "typst",
    "pyspellchecker",
    "language_tool_python",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
resume = "app.cli:app"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.typ"]
