[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "resumeOS"
version = "0.1.0"
description = "Local career warehouse — type resume init to start."
requires-python = ">=3.11"
dependencies = [
    "typer",
    "rich",
    "pypdf",
    "pdfplumber",
    "pyyaml",
    "httpx",
    "beautifulsoup4",
    "typst",
    "pyspellchecker",
]

[project.optional-dependencies]
dev = ["pytest"]
# Grammar checking with LanguageTool: needs Java 17+, downloads ~260 MB on first use.
grammar = ["language_tool_python"]
# Meaning-based matching (fastembed + ONNX, no PyTorch); ~65 MB model on first use.
embeddings = ["fastembed"]

[project.scripts]
resume = "app.cli:app"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.typ", "templates/fonts/*"]

[tool.pytest.ini_options]
markers = ["network: hits real job boards over the internet (run with -m network)"]
addopts = "-m 'not network'"
